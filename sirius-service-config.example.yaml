# Run: sirius-asset-updater serve sirius-service-config.yaml
# Relative paths are resolved from the process working directory.
listen: 127.0.0.1:12345
token_env: SIRIUS_ASSET_SERVICE_TOKEN
state_directory: ./service-state
output_directory: ./service-output
max_concurrent_jobs: 4
max_queued_jobs: 64
retain_terminal_jobs: 256
timeout_seconds: 3600
profiles:
  jp-full:
    region: jp
    download_config: ./sirius-asset-config.yaml
    export_config: ./export-config.yaml
    # storage_config: ./storage-config.yaml # requires retained exports
    # Optional verified publication for standalone export/verify operations:
    # input: ./downloads/catalogs/PUBLISHED_DIRECTORY

# Optional HTTPS listener; see docs/LISTENER_TLS.md. Restart after certificate renewal.
# tls:
#   certificate_file: /etc/sirius/tls/fullchain.pem
#   private_key_file: /etc/sirius/tls/key.pem
#   handshake_timeout_ms: 10000

# Optional access logging. Omitted means disabled. See docs/ACCESS_LOG.md.
# access_log:
#   format: json
#   output: {type: file, path: ./logs/access.log, rotation: daily, max_files: 7}
#   queue_capacity: 4096
#   trusted_proxies: [] # only configured CIDRs may supply forwarding headers
#   proxy_header: x-forwarded-for
