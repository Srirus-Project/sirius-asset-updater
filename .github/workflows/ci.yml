name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check build
        run: cargo check --locked -p sirius-asset-updater --all-targets

      - name: Run Clippy
        run: cargo clippy --locked -p sirius-asset-updater --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked -p sirius-asset-updater

  media-ffi:
    name: FFmpeg 7 codec bridge
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - name: Install FFmpeg development libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl clang pkg-config build-essential git ffmpeg libavcodec-dev libavdevice-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --features media-ffi
      - run: cargo test --locked --features media-ffi ffi_audio_preserves_pcm_and_native_mp3_shapes -- --ignored
        env:
          SIRIUS_TEST_FFMPEG: /usr/bin/ffmpeg
      - run: cargo test --locked --features media-ffi ffi_video_preserves_m2v_ivf_frames_and_muxed_audio -- --ignored
        env:
          SIRIUS_TEST_FFMPEG: /usr/bin/ffmpeg
