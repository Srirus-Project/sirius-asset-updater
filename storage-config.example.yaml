# Profile storage_config points to this file. See docs/STORAGE.md.
# {region} (alias {server}) expands to jp/tw/en/kr in prefix/public URL/local directory/S3 bucket/endpoint.
# Example: directory: ./published/{region}; bucket: sirius-{region}. Credentials are never templated.
providers:
  - name: local
    prefix: assets
    backend:
      type: local
      directory: ./published-assets
  # - name: s3
  #   prefix: assets
  #   public_base_url: https://cdn.example.com/ # optional bucket-root URL
  #   backend:
  #     type: s3
  #     endpoint: https://s3.example.com
  #     path_style: true # false for bucket.endpoint virtual-host addressing
  #     request_payer: false # opt in only when this account accepts request charges
  #     public_read: false
  #     public_read_include: [] # e.g. ['\.png$']
  #     public_read_exclude: [] # exclusions always win
  #     write_options: # optional, applies to objects and publication markers
  #       # default_acl: bucket-owner-full-control # optional; see ACL precedence in docs/STORAGE.md
  #       checksum_algorithm: crc32c # optional; destination must support multipart CRC32C
  #       storage_class: STANDARD
  #       server_side_encryption: aws:kms # alternatively AES256; omit for bucket default
  #       kms_key_id_env: SIRIUS_STORAGE_KMS_KEY_ID # optional; requires aws:kms
  #       # Or omit both encryption fields above and enable SSE-C:
  #       # customer_key_base64_env: SIRIUS_STORAGE_CUSTOMER_KEY # Base64-encoded 32 bytes
  #     bucket: sirius-assets
  #     region: auto
  #     access_key_id_env: SIRIUS_STORAGE_ACCESS_KEY_ID
  #     secret_access_key_env: SIRIUS_STORAGE_SECRET_ACCESS_KEY
  #     session_token_env: SIRIUS_STORAGE_SESSION_TOKEN # optional temporary credentials
concurrency: 4
attempts: 3
object_timeout_seconds: 300
retry_delay_ms: 500
remove_local_after_upload: false
