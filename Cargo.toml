[package]
name = "sirius-asset-updater"
version = "1.1.0"
edition = "2021"
rust-version = "1.96"
description = "Resource downloader and exporter for BanG Dream! Our Notes"
repository = "https://github.com/Srirus-Project/sirius-asset-updater"
readme = "README.md"
license = "MIT"
publish = false

[[bin]]
name = "sirius-asset-updater"
path = "src/main.rs"

[features]
default = []
media-ffi = ["dep:rsmpeg"]

[dependencies]
bytes = "1"
http = "1"
reqsign-aws-v4 = "=3.3.0"
reqsign-core = "=3.3.1"
base64 = "0.22"
libc = "0.2"
rsmpeg = { version = "=0.18.0", default-features = false, features = ["ffmpeg7_1", "link_system_ffmpeg"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
opendal = { version = "=0.58.2", default-features = false, features = ["services-fs", "services-s3", "executors-tokio"] }
opendal-http-transport-reqwest = { version = "=0.58.2", default-features = false, features = ["rustls"] }
tracing-appender = "0.2"
ipnet = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
axum = "0.8"
unity-rs-core = "=0.5.1"
cridecoder = "=0.3.5"
png = "0.18"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
aes = "0.8"
ctr = "0.9"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip", "http2"] }
serde = { version = "1", features = ["derive"] }
sonic-rs = "0.5"
sha2 = "0.11"
hex = "0.4"
tempfile = "3.27"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
yaml_serde = "0.10"
regex = "1.12"


[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
