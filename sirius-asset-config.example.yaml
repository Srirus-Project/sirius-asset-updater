# Region and deployment environment are independent. See docs/REGIONS.md.
region: jp
platform: iOS
game_api_root: http://127.0.0.1:9999
internal_token_env: SIRIUS_INTERNAL_TOKEN
# Optional API-scope token: renew version observations before/throughout downloads.
# Must differ from the internal token; never sent to the CDN.
refresh_token_env: SIRIUS_API_TOKEN
environment: release
client_version: 1.0.3
protocol_version: 1.0.3
output: ./downloads/catalogs
cdn_roots:
  https://static.bang-dream-on.jp:
    username_env: SIRIUS_CDN_USERNAME
    credential_env: SIRIUS_CDN_CREDENTIAL
# Optional: download catalog-referenced remote resources in the same atomic run.
# Without this section, only the catalog is downloaded.
# assets:
#   selection:
#     keys: [] # all catalog entries; e.g. [InitialDownload] is a subset
#     include: [] # regex over root primary keys/internal IDs
#     exclude: [] # excludes roots, never required dependencies
#     priority: [] # ordered regex over remote relative paths
#   concurrency: 4 # range: 1–16
#   cache_directory: ./downloads/cache
#   max_file_bytes: 536870912
#   max_total_bytes: 17179869184
#   # Omit decrypt to retain encrypted bundles as downloaded.
#   decrypt:
#     key_hex_env: SIRIUS_BUNDLE_KEY_HEX
#     nonce_seed_hex_env: SIRIUS_BUNDLE_NONCE_SEED_HEX

# Set true when using a multi-region API deployment. The region selects both routes.
regional_routes: false

# Optional request policy; these are the defaults. See docs/NETWORK.md.
# network:
#   asset_http_version: auto # auto (TLS ALPN) or http1, CDN requests only
#   # Optional independent HTTP/HTTPS forward proxies; absent means direct.
#   # api_proxy: {url_env: SIRIUS_API_PROXY_URL, authorization_env: SIRIUS_API_PROXY_AUTHORIZATION}
#   # cdn_proxy: {url_env: SIRIUS_CDN_PROXY_URL, authorization_env: SIRIUS_CDN_PROXY_AUTHORIZATION}
#   connect_timeout_ms: 10000
#   download_timeout_ms: 60000
#   snapshot_timeout_ms: 10000
#   refresh_timeout_ms: 30000
#   revalidate_interval_ms: 120000
#   snapshot_retry: {attempts: 3, delay_ms: 500, max_delay_ms: 5000}
#   catalog_retry: {attempts: 3, delay_ms: 250, max_delay_ms: 5000}
#   asset_retry: {attempts: 3, delay_ms: 250, max_delay_ms: 5000}

# Optional application events; default is info/text on stderr. See docs/APPLICATION_LOG.md.
# logging:
#   level: info
#   format: json
#   output: {type: file, path: ./logs/application.log, rotation: daily, max_files: 7}
#   queue_capacity: 4096

# Export profile scheduling is configured in its separate export YAML.
# See docs/EXPORT_OPTIONS.md: stage_limits.auto_tune derives omitted stage caps
# from the CPU budget while preserving explicit stage values as upper bounds.
