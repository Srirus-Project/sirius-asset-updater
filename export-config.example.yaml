# Read a verified download; no game/CDN credentials are used by this command.
input: ./downloads/catalog-example
output: ./exports/run-example
retain_outputs: true
concurrency: 4
# Separate per-export FFmpeg process limit (1..4); shared by decode/encode/validation.
media_concurrency: 2
cri_key_env: SIRIUS_CRI_KEY
split_acb_xor_env: SIRIUS_SPLIT_ACB_XOR
ffmpeg: /usr/bin/ffmpeg

# Includes waiting for a media slot, then child execution.
media_timeout_seconds: 120
max_resource_output_bytes: 2147483648
# Empty means every downloaded resource. Exact receipt paths can select a subset.
paths: []
# Empty provider/class lists retain all types. Class IDs are exact Unity IDs.
selection:
  providers: [] # unity, cri
  unity_class_ids: [] # e.g. [28, 213] for Texture2D and Sprite
  embedded_audio: true
# Native lossless image formats: png, webp, bmp, tga.
# JPEG requires both quality (1..100) and an explicit RGB background.
# image: {format: jpeg, quality: 90, background: [255, 255, 255]}
image: {format: png}
# FLAC is validated by an exact PCM roundtrip. USM keeps Matroska video.
audio: wav # Or a list: [wav, flac, mp3]. MP3 always retains WAV or verified FLAC.

# Optional decoded-resource cache; requires retain_outputs: true.
# Keep separate from inputs, outputs and the ciphertext cache. See docs/EXPORT_CACHE.md.
# cache_directory: ./cache/decoded
# Bump after external shared-library/runtime changes without executable changes.
# cache_revision: ""
# cache_max_bytes: 53687091200 # optional 50 GiB of managed decoded entries
# cache_max_entries: 20000

# Optional application events; default is info/text on stderr. See docs/APPLICATION_LOG.md.
# logging:
#   level: info
#   format: json
#   output: {type: file, path: ./logs/application.log, rotation: daily, max_files: 7}
#   queue_capacity: 4096

# Video containers: source, mkv (default), mp4, mkv_and_mp4.
# MP4 is lossy; native video and WAV/FLAC audio remain preserved. See docs/EXPORT_OPTIONS.md.
video: mkv
